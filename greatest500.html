// ── STATE ────────────────────────────────────────────────────────────────────
let currentIdx = -1;
let source = 'yt';
let filtered = SONGS.slice();

// ── UI ───────────────────────────────────────────────────────────────────────
function setSource(s) {
  source = s;
  document.getElementById('tab-yt').classList.toggle('active', s === 'yt');
  document.getElementById('tab-sp').classList.toggle('active', s === 'sp');
  document.getElementById('yt-wrap').classList.toggle('hidden', s !== 'yt');
  document.getElementById('sp-wrap').classList.toggle('hidden', s !== 'sp');
  document.getElementById('yt-open').style.display = s === 'yt' ? '' : 'none';
}

function ytSearchUrl(song) {
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(song.a + ' ' + song.t);
}

function ytEmbedUrl(song) {
  const q = encodeURIComponent(song.a + ' ' + song.t + ' official');
  return 'https://www.youtube.com/embed?listType=search&list=' + q + '&autoplay=1&rel=0&index=0';
}

function playSong(idx) {
  const song = filtered[idx];
  if (!song) return;
  currentIdx = idx;

  // Update now bar
  document.getElementById('now-rank').textContent = song.r;
  document.getElementById('now-title').textContent = song.t;
  document.getElementById('now-artist').innerHTML = song.a + '<span id="now-year"> · ' + song.y + '</span>';

  // YouTube embed
  const frame = document.getElementById('yt-frame');
  frame.src = ytEmbedUrl(song);

  // Open in YouTube link
  const lnk = document.getElementById('yt-open');
  lnk.href = ytSearchUrl(song);
  lnk.style.display = '';

  // Highlight row
  document.querySelectorAll('.song-row').forEach(function(r, i) {
    r.classList.toggle('playing', i === idx);
  });

  // Scroll active row into view
  const rows = document.querySelectorAll('.song-row');
  if (rows[idx]) rows[idx].scrollIntoView({block:'nearest', behavior:'smooth'});
}

function skip(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < filtered.length) playSong(next);
}

function filterList(query) {
  const q = query.trim().toLowerCase();
  filtered = q ? SONGS.filter(function(s) {
    return s.t.toLowerCase().includes(q) || s.a.toLowerCase().includes(q);
  }) : SONGS.slice();
  renderList();
  document.getElementById('count-label').textContent = filtered.length + ' of 500';
  if (currentIdx >= filtered.length) currentIdx = -1;
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = filtered.map(function(s, i) {
    return '<div class="song-row' + (i === currentIdx ? ' playing' : '') + '" onclick="playSong(' + i + ')">' +
      '<span class="s-rank">' + s.r + '</span>' +
      '<span class="s-title">' + esc(s.t) + '</span>' +
      '<span class="s-artist">' + esc(s.a) + '</span>' +
      '<span class="s-year">' + s.y + '</span>' +
      '</div>';
  }).join('');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ─────────────────────────────────────────────────────────────────────
renderList();
// Set initial YouTube iframe src to empty (avoid autoplay on load)
document.getElementById('yt-frame').src = 'about:blank';
</script>
